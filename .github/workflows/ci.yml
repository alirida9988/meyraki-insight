name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · contracts · 89 offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts -e "apps/api[dev]"

      - name: Tests (offline — no model calls, no network)
        working-directory: apps/api
        env:
          # conftest.py sets these too; making them explicit here means a CI run
          # can never silently start spending model credits.
          MEYRAKI_USE_AGENTS: "off"
          MEYRAKI_RATELIMIT: "off"
        run: python -m pytest tests ../../packages/contracts/tests -q

      - name: Guard — no live-network test slipped into the offline suite
        working-directory: apps/api
        run: |
          if grep -rn "qa_hunt" tests/test_*.py; then
            echo "::error::the live QA hunt must stay opt-in, not in the pytest suite"
            exit 1
          fi

  web:
    name: Web · lint · production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Build
        working-directory: apps/web
        run: pnpm build

# NOT run here, by design:
#   apps/web/e2e (Playwright)  — needs the live stack + paid model calls
#   apps/api/tests/qa_hunt.py  — same
# Both are run locally before every claim of "done"; see CLAUDE.md § How we work.
