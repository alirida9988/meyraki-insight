name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Manual re-run. GitHub occasionally does not fire the pull_request trigger on a
  # freshly opened PR, and without this there is no way to ask for a run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · contracts · offline suite
    runs-on: ubuntu-latest
    services:
      # Only the migration check needs it — the test suite itself runs on SQLite and
      # never opens a socket.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meyraki
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meyraki_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meyraki -d meyraki_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # The shared rate-limit tests skip themselves when no Redis is reachable, and a
      # test that skips in CI protects nothing — this is the layer where the multi-worker
      # auth ceiling is actually verified.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts -e "apps/api[dev]"

      - name: Tests (offline — no model calls, no network)
        working-directory: apps/api
        env:
          # conftest.py sets these too; making them explicit here means a CI run
          # can never silently start spending model credits.
          MEYRAKI_USE_AGENTS: "off"
          MEYRAKI_RATELIMIT: "off"
        run: python -m pytest tests ../../packages/contracts/tests -q

      - name: Migrations build the schema, and match the models
        # `alembic check` is the drift guard. Without it, models and migrations diverge
        # silently — this repo's own dev database had already lost an index and a foreign
        # key that way, because create_all makes tables but never alters them.
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://meyraki:ci@localhost:5432/meyraki_ci
        run: |
          alembic upgrade head
          alembic check

      - name: Guard — the offline suite cannot reach a model, even with a key present
        working-directory: apps/api
        env:
          # A real key plus agents disabled: if any test tries to call a model, the
          # guard in agents._parse must stop it. This is the check that matters —
          # MEYRAKI_USE_AGENTS=off used to be honoured only by the pipeline, so a
          # test calling an agent directly would have billed a developer's key.
          ANTHROPIC_API_KEY: "sk-ant-not-a-real-key-guard-test"
          MEYRAKI_USE_AGENTS: "off"
          MEYRAKI_RATELIMIT: "off"
        run: |
          python -m pytest tests ../../packages/contracts/tests -q
          if grep -rn "qa_hunt" tests/test_*.py; then
            echo "::error::the live QA hunt must stay opt-in, not in the pytest suite"
            exit 1
          fi

  web:
    name: Web · lint · production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Build
        working-directory: apps/web
        run: pnpm build

  images:
    name: Docker · api + web build
    runs-on: ubuntu-latest
    # Runs on every PR. The first build is slow (Chromium plus the scientific stack);
    # after that the GitHub Actions cache below makes it cheap, and a deployment that
    # only gets built at deploy time is a deployment nobody has tested.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: meyraki-api:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api

      - name: The image must know which commit it was built from
        # An image that cannot say what it is makes every incident start with guesswork,
        # and it silently breaks the analysis provenance stamp: a container has no git
        # history, so if the build argument is not wired through, every analysis it runs
        # is recorded as "unknown" and no report can be traced back to its code.
        run: |
          got=$(docker run --rm --entrypoint python meyraki-api:ci -c \
            "import os,sys; sys.path.insert(0,'/app/apps/api'); from app.version import build_version; print(build_version())")
          echo "image reports build: $got"
          test "$got" = "${{ github.sha }}" || { echo "expected ${{ github.sha }}"; exit 1; }

      - name: The image must actually be able to render a PDF
        # The report deliverable is printed by Chromium inside this image. An image that
        # builds but cannot launch a browser passes every other check and ships broken.
        run: |
          docker run --rm --entrypoint python meyraki-api:ci -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); page = b.new_page()
              page.set_content('<h1>meyraki</h1>'); pdf = page.pdf(format='A4'); b.close()
          assert pdf.startswith(b'%PDF-'), 'no PDF produced'
          print('chromium rendered', len(pdf), 'bytes of PDF')
          "

      - name: The pedestrian simulation must run inside the image
        # The image deliberately strips jupedsim's desktop viewer (PySide6 + VTK, 1.3 GB
        # a headless server cannot use). If a future version imports them at module
        # level, the flow step would fall back to distance decay in production and
        # nothing else here would notice.
        run: |
          docker run --rm -e MEYRAKI_USE_AGENTS=off -w /app/apps/api --entrypoint python meyraki-api:ci -c "
          from app import pedestrian
          from app.agents import WireAdjacency, WirePoint, WireZone, WireZoneGraph, repair_zone_graph
          def wz(i, c, pts):
              return WireZone(id=i, category=c, label=i, confidence=0.9,
                              polygon=[WirePoint(x=x, y=y) for x, y in pts])
          g = repair_zone_graph(WireZoneGraph(zones=[
              wz('entrance','entrance',[(0,.75),(.3,.75),(.3,1),(0,1)]),
              wz('lobby','lobby',[(0,.3),(.55,.3),(.55,.75),(0,.75)]),
              wz('cafe','dining',[(.55,.3),(1,.3),(1,.8),(.55,.8)])],
              adjacency=[WireAdjacency(a='entrance',b='lobby'), WireAdjacency(a='lobby',b='cafe')],
              entrances=['entrance']))
          i, notes, reason = pedestrian.simulate(g)
          assert i is not None, f'simulation declined: {reason}'
          print('jupedsim ran headless:', i)
          "

      - name: The installed package must not be a stub
        # The builder installs from manifests first for layer caching; without the second
        # source install, site-packages holds an `app` package containing only
        # __init__.py, shadowed at runtime by the working directory purely by accident.
        run: |
          docker run --rm -w / --entrypoint python meyraki-api:ci -c "
          import app, glob, os
          mods = glob.glob(os.path.join(os.path.dirname(app.__file__), '*.py'))
          assert len(mods) > 5, f'site-packages holds a stub: {len(mods)} modules'
          print('installed package is complete:', len(mods), 'modules')
          "

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: meyraki-web:ci
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: The web image must actually start and serve its assets
        # `docker run --rm image id -u` overrides the CMD, so it proves nothing about the
        # entrypoint. This image once crash-looped on a wrong server.js path, and once
        # served an unstyled login page with every /_next/static asset 404ing — both
        # invisible to any check that does not start it and follow a real reference.
        run: |
          docker run -d --name web -p 3000:3000 meyraki-web:ci
          for i in $(seq 1 30); do
            curl -sf -o /tmp/login.html http://127.0.0.1:3000/login && break
            sleep 2
          done
          curl -sf -o /tmp/login.html http://127.0.0.1:3000/login || {
            echo "::error::the web container never served /login"; docker logs web; exit 1; }
          asset=$(grep -o '/_next/static/[^"]*\.js' /tmp/login.html | head -1)
          if [ -n "$asset" ]; then
            curl -sf -o /dev/null "http://127.0.0.1:3000$asset" || {
              echo "::error::static assets 404 — the page renders unstyled"; exit 1; }
            echo "served /login and its asset $asset"
          else
            echo "::error::/login referenced no static asset — suspicious"; exit 1
          fi
          docker rm -f web

      - name: Both images run as a non-root user
        run: |
          for image in meyraki-api:ci meyraki-web:ci; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            echo "$image runs as uid $uid"
            [ "$uid" != "0" ] || { echo "::error::$image runs as root"; exit 1; }
          done

      - name: The compose file is valid and never binds to a public interface
        # Assert every published port IS loopback, rather than grepping for the bad case:
        # `docker compose config` puts host_ip on its own line, and a bare "3000:3000"
        # (every interface) emits no host_ip line at all — so the negative grep passed a
        # deliberately public binding.
        run: |
          docker compose config --quiet
          # Sharing is deliberately disabled if its signing secret is absent. It must
          # reach the API container when an operator configures it in .env; otherwise
          # the UI ships a "Copy client link" button that always returns 503.
          docker compose config | grep -q 'MEYRAKI_SHARE_SECRET: ci-share-secret'
          published=$(docker compose config | grep -c 'published:' || true)
          loopback=$(docker compose config | grep -c 'host_ip: 127\.0\.0\.1' || true)
          echo "$published published port(s), $loopback bound to loopback"
          [ "$published" = "$loopback" ] || {
            echo "::error::a published port is not loopback-only — compose terminates no TLS"
            docker compose config | grep -A2 'published:'
            exit 1
          }
        env:
          POSTGRES_PASSWORD: ci-not-a-real-password
          ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key
          MEYRAKI_SHARE_SECRET: ci-share-secret

# NOT run here, by design:
#   apps/web/e2e (Playwright)  — needs the live stack + paid model calls
#   apps/api/tests/qa_hunt.py  — same
# Both are run locally before every claim of "done"; see CLAUDE.md § How we work.
