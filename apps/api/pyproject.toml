[project]
name = "meyraki-api"
version = "0.1.0"
description = "Meyraki Insight API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "meyraki-contracts",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "ortools>=9.10",
    "anthropic>=0.60",
    "playwright>=1.45",
    "bcrypt>=4.1",
    "jupedsim>=1.4",  # LGPL-3.0, unmodified pip dependency (docs/04 §3)
    "alembic>=1.13",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
